   Una palabra de varias palabras se busca como texto seguido; los límites solo se exigen en los extremos que son letra o número. Sin solapamientos. */
const lyrNorm=f=>String(f||'').normalize('NFC');
const LY_ESC=a=>a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function lyrHits(f,a){f=lyrNorm(f);a=lyrNorm(a);if(!a)return[];const ch=Array.from(a),w=c=>/[\p{L}\p{N}]/u.test(c);let re;
try{re=new RegExp('('+(w(ch[0])?'^|[^\\p{L}\\p{N}\\p{M}]':'')+')('+LY_ESC(a)+')'+(w(ch[ch.length-1])?'(?![\\p{L}\\p{N}\\p{M}])':''),'giu')}catch(e){return[]}
const o=[];let m;while((m=re.exec(f))){if(!m[2].length){re.lastIndex++;continue}const s0=m.index+m[1].length;o.push({s:s0,e:s0+m[2].length})}return o}
function lyrInside(f,a){f=lyrNorm(f);a=lyrNorm(a);if(!a)return'';const whole=new Set(lyrHits(f,a).map(h=>h.s)),W=/[\p{L}\p{N}\p{M}]/u;let re;try{re=new RegExp(LY_ESC(a),'giu')}catch(e){return''}
let m;while((m=re.exec(f))){if(!m[0].length){re.lastIndex++;continue}if(whole.has(m.index))continue;let s0=m.index,e0=m.index+m[0].length;while(s0>0&&W.test(f[s0-1]))s0--;while(e0<f.length&&W.test(f[e0]))e0++;return f.slice(s0,e0)}return''}
const lyr=(f,a)=>{f=lyrNorm(f);const H=lyrHits(f,a);if(!H.length)return esc(f);let o='',p=0;H.forEach(h=>{o+=esc(f.slice(p,h.s))+'<span class=bl>_____</span>';p=h.e});return o+esc(f.slice(p))};

if(g==2){G.M={p:shuf(G.D.g2),d:{},t:{},a:null,s:null};if(!G.D.g2.length)return endGame()}
else{G.Q=G.D['g'+g].map((i,j)=>G.S['g'+g][j]).map(x=>({x,o:g==5?[]:shuf([...new Map([x.ans,...x.alts].filter(Boolean).map(o=>[norm(o),o])).values()]),tries:0,max:GI('g'+g),hint:0,res:'',wrong:[]}));if(!G.Q.length)return endGame()}pSave();render()}

if(r.view=='game'){if(r.g==2)g.M={p:r.M.p.slice(),d:Object.assign({},r.M.d),t:Object.assign({},r.M.t),a:null,s:null};else g.Q=r.Q.map((q,j)=>({x:r.S['g'+r.g][j],o:q.o.slice(),tries:q.tries,max:q.max,hint:r.g==5?z5hc(q.hint):(q.hint?1:0),...(r.g==5?{hit:typeof q.hit=='string'?q.hit:''}:{}),res:q.res||'',wrong:q.wrong.slice(),last:q.last}))}

s:()=>{const s=SN(),FL=[['hint','💡 Uso de una pista'],['game','🏁 Fin de un juego'],['record','🏅 Nuevo récord'],['final','🎉 Pantalla final de la actividad']];

<div class=card><h3>📺 ¿En qué pantallas suena la música?</h3><p class=note>Marca las pantallas donde quieres que suene. En las demás habrá silencio. Al pasar de una pantalla a otra la música se corta y, si la nueva está marcada, empieza desde el principio.</p>${[['home','Portada (inicio)'],['group','Pantalla del nombre'],['g1','Juego 1: '+esc(C.names[0])],['g2','Juego 2: '+esc(C.names[1])],['g3','Juego 3: '+esc(C.names[2])],['g4','Juego 4: '+esc(C.names[3])],['g5','Juego 5: '+esc(C.names[4])],['trans','Pantalla entre juegos'],['final','Resumen final'],['hs','Récords (HIGH SCORES)']].map(([k,l])=>`<label class=f><input type=checkbox style="width:26px;height:26px" data-p="snd.musicScreens.${k}" ${(s.musicScreens||{})[k]?'checked':''}> ${l}</label>`).join('')}</div>
